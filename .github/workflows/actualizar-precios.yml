name: Actualizar precios 4 tiendas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Actualizar precios (4 tiendas)
        env:
          ENABLE_BROWSER_SUPPLY: "1"
          PLAYWRIGHT_CHANNEL: "none"
          SUPPLY_DELAY_MS: "120"
          GAMES_EXCEL: "GAMES LIST - AUTO.xlsx"
          DOLAR_DIGITAL_VENTA: "1561"
        run: node scripts/actualizar-precios.cjs --links-only

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kinguin-price-data.json js/catalog.js js/steam-about-cache.js js/steam-details-cache.js guia-compras.json guia-compras.csv guia-compras.xlsx guia-compras-excel.csv ultima-actualizacion-precios.log compras-pendientes.txt
          if git diff --staged --quiet; then
            echo "Sin cambios de precios."
          else
            git commit -m "chore: actualizar precios 4 tiendas [automatico]"
            git push
          fi
